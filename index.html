<!doctype html><html lang="ja"><head>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人生RPG</title><style>:root{font-family:system-ui,sans-serif;color:#f5f3ff;background:#101020}body{margin:0}main{max-width:650px;margin:auto;padding:18px}h1{font-size:26px}h2{font-size:18px}.panel{background:#202039;border:1px solid #454267;border-radius:17px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#292947;padding:12px;border-radius:12px}button,input{font:inherit}button{background:#7255dc;color:white;border:0;border-radius:10px;padding:10px 13px;margin:3px;cursor:pointer}input{width:75px;background:#111126;color:white;border:1px solid #666;border-radius:7px;padding:7px}progress{width:100%;accent-color:#c99bff}small{color:#c4c0d7}.title{color:#ffe49a;font-weight:bold}.overlay{position:fixed;inset:0;background:#090611f5;display:none;align-items:center;justify-content:center;z-index:3;text-align:center;padding:20px}.overlay.show{display:flex}.glow{font-size:48px;animation:pulse 1s infinite alternate}@keyframes pulse{to{transform:scale(1.18);filter:drop-shadow(0 0 24px gold)}}.muted{color:#b9b5ce}.tabs{display:flex;flex-wrap:wrap}section{display:none}section.active{display:block}label{display:inline-block;margin:5px}.avatar{font-size:85px;text-align:center}.bar{height:12px;background:#45405c;border-radius:8px;overflow:hidden}.bar>div{height:100%;background:#4ade80}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #454267;text-align:left}</style></head><body><main><h1>🐗 人生RPG <small>試作版 v0.1</small></h1><div class="tabs"><button onclick="tab('home')">🏠 HOME</button><button onclick="tab('train')">⚔️ TRAIN</button><button onclick="tab('rest')">🛌 REST</button><button onclick="tab('titles')">👑 称号</button><button onclick="tab('report')">📊 REPORT</button></div><section id="home" class="active"><div class="panel"><div id="avatar" class="avatar">🥊</div><h2 id="hero">拳闘士 Lv.1</h2><div id="equipped" class="title"></div><p>EXP <span id="exp"></span></p><progress id="xpbar" max="100" value="0"></progress><p>❤️ HP <span id="hp"></span> / 100</p><div class="bar"><div id="hpbar"></div></div><p>⚡ STAMINA <span id="stamina"></span> / 100</p><div class="bar"><div id="stbar"></div></div></div><div class="panel"><h2>⚖️ BODY STATUS</h2><label>体重 kg <input id="weight" type="number" step="0.1" min="1"></label><label>体脂肪率 % <input id="fat" type="number" step="0.1" min="1" max="70"></label><button onclick="saveBody()">記録</button><p id="bodymsg" class="muted"></p><small>キャラの見た目はゲーム演出。体脂肪率は個人差があるため医学的な判定には使用しません。</small></div></section><section id="train"><div class="panel"><h2>⚔️ 四系統の修行</h2><p class="muted">実施した筋トレを記録するとEXP獲得。各系統の称号が進化する！</p><div id="trainlist"></div></div><div class="panel"><h2>🏃 その他のクエスト</h2><label>RUN km <input id="km" type="number" min="0" step="0.01" value="5"></label><button onclick="runLog()">RUN記録</button><br><label>シャドー R <input id="rounds" type="number" min="0" value="12"></label><button onclick="shadowLog()">シャドー記録</button></div></section><section id="rest"><div class="panel"><h2>🏨 宿屋で回復</h2><label>夜間睡眠 時間 <input id="sleep" type="number" min="0" max="24" step="0.5" value="7"></label><button onclick="restLog('sleep')">睡眠記録</button><br><label>昼寝 分 <input id="nap" type="number" min="0" max="240" value="20"></label><button onclick="restLog('nap')">昼寝記録</button><p>睡眠時間に応じてHPとスタミナが回復するゲーム演出やで！</p></div></section><section id="titles"><div class="panel"><h2>👑 称号図鑑</h2><div id="titlelist"></div></div></section><section id="report"><div class="panel"><h2>📊 冒険レポート</h2><div id="reportbody"></div><button onclick="window.print()">🖨️ 印刷 / PDF</button><button onclick="exportData()">💾 JSON保存</button><label style="display:block">📂 JSON復元 <input type="file" accept="application/json" onchange="importData(event)" style="width:100%;max-width:260px"></label></div></section></main><div id="overlay" class="overlay" onclick="this.classList.remove('show')"><div><div class="glow">👑✨</div><h1 style="color:#ffe49a">TITLE UNLOCKED!</h1><h1 id="newtitle"></h1><p>新たな伝説が刻まれた！</p><button onclick="document.getElementById('overlay').classList.remove('show')">冒険を続ける</button></div></div><script>
const KEY='nao-life-rpg-v1', names=['🛡️ A 守護','⚔️ B 剛力','🌀 C 均衡','🔥 D 爆発'], titleNames=[['体幹の芽','大地の番人','不動の守護者','鉄壁の巨神'],['鉄を持つ者','怪力の傭兵','剛力の戦士','破壊神'],['均衡の弟子','重心の操者','均衡の達人','天秤の神'],['火花の使い手','爆炎の拳士','爆発の化身','紅蓮の覇者']];let s=JSON.parse(localStorage.getItem(KEY)||'null')||{exp:0,hp:80,stamina:80,counts:[0,0,0,0],weight:'',fat:'',unlocked:[],logs:[],equipped:''};function persist(){localStorage.setItem(KEY,JSON.stringify(s));render()}function level(i){return Math.min(10,Math.floor(s.counts[i]/3)+1)}function allTitles(){let t=[];for(let i=0;i<4;i++){let l=level(i);[1,3,6,9].forEach((need,j)=>{if(l>=need)t.push(titleNames[i][j])})}let a=s.counts.map((_,i)=>level(i)),min=Math.min(...a);if(Math.max(...a)-min<=1){if(min>=3)t.push('四門の戦士');if(min>=5)t.push('四極の覇者');if(min>=8)t.push('四天統べる覇王')}if(s.logs.filter(x=>x.type==='run').reduce((a,x)=>a+x.value,0)>=100)t.push('疾風の旅人');if(s.logs.filter(x=>x.type==='shadow').reduce((a,x)=>a+x.value,0)>=500)t.push('千本拳闘士');return t}function checkTitles(){let newly=allTitles().filter(t=>!s.unlocked.includes(t));s.unlocked.push(...newly);if(newly.length){s.equipped=newly[newly.length-1];document.getElementById('newtitle').textContent='《'+s.equipped+'》';document.getElementById('overlay').classList.add('show')}}function log(type,value,exp){s.logs.push({date:new Date().toISOString(),type,value,exp});s.exp+=exp;checkTitles();persist()}function train(i){s.counts[i]++;s.hp=Math.max(0,s.hp-4);s.stamina=Math.max(0,s.stamina-12);log('筋トレ'+ 'ABCD'[i],1,80)}function runLog(){let v=Number(document.getElementById('km').value);if(!(v>0&&v<=100))return alert('距離を確認してな');s.stamina=Math.max(0,s.stamina-Math.round(v*2));log('run',v,Math.round(v*20))}function shadowLog(){let v=Number(document.getElementById('rounds').value);if(!(v>0&&v<=100))return alert('R数を確認してな');s.stamina=Math.max(0,s.stamina-Math.round(v/2));log('shadow',v,v*10)}function restLog(type){let v=Number(document.getElementById(type==='sleep'?'sleep':'nap').value);if(!(v>0&&v<=(type==='sleep'?24:240)))return alert('時間を確認してな');s.hp=Math.min(100,s.hp+Math.round(v*(type==='sleep'?8:.4)));s.stamina=Math.min(100,s.stamina+Math.round(v*(type==='sleep'?10:.5)));log(type,v,type==='sleep'?Math.round(v*7):Math.round(v/2))}function saveBody(){let w=Number(document.getElementById('weight').value),f=Number(document.getElementById('fat').value);if(!(w>0&&w<300&&f>0&&f<70))return alert('数値を確認してな');s.weight=w;s.fat=f;log('body',w,0)}function tab(id){document.querySelectorAll('section').forEach(e=>e.classList.toggle('active',e.id===id));render()}function render(){let lvl=Math.floor(s.exp/1000)+1;document.getElementById('hero').textContent='拳闘士 Lv.'+lvl;document.getElementById('exp').textContent=s.exp+' / 次まで '+(1000-s.exp%1000);document.getElementById('xpbar').value=s.exp%1000/10;document.getElementById('hp').textContent=s.hp;document.getElementById('stamina').textContent=s.stamina;document.getElementById('hpbar').style.width=s.hp+'%';document.getElementById('stbar').style.width=s.stamina+'%';document.getElementById('equipped').textContent=s.equipped?'👑 '+s.equipped:'称号なし';document.getElementById('weight').value=s.weight;document.getElementById('fat').value=s.fat;document.getElementById('avatar').textContent=s.fat? (s.fat>=30?'🐻🥊':s.fat>=23?'🐗🥊':'🥷🥊'):'🐗🥊';document.getElementById('bodymsg').textContent=s.weight?'体重 '+s.weight+'kg / 体脂肪率 '+s.fat+'%':'';document.getElementById('trainlist').innerHTML=names.map((n,i)=>'<div class="stat" style="margin:9px 0"><b>'+n+'</b>　Lv.'+level(i)+'<br><small>累計 '+s.counts[i]+'回達成</small><br><button onclick="train('+i+')">修行完了 +80 EXP</button></div>').join('');document.getElementById('titlelist').innerHTML='<p>獲得 '+s.unlocked.length+' 称号</p>'+s.unlocked.map(t=>'<div class="stat" style="margin:6px 0">👑 '+t+' <button onclick="equip('+JSON.stringify(t).replace(/"/g,'&quot;')+')">装備</button></div>').join('')+'<h3>🔒 未解放</h3>'+titleNames.flat().filter(t=>!s.unlocked.includes(t)).map(t=>'<p class="muted">？？？ '+t+'</p>').join('');let total=s.logs.length,run=s.logs.filter(x=>x.type==='run').reduce((a,x)=>a+x.value,0),shadow=s.logs.filter(x=>x.type==='shadow').reduce((a,x)=>a+x.value,0);document.getElementById('reportbody').innerHTML='<p>総EXP：'+s.exp+' / 記録件数：'+total+'</p><p>RUN累計：'+run.toFixed(2)+'km / シャドー累計：'+shadow+'R</p><p>筋トレ A〜D：'+s.counts.join(' / ')+'</p><p>称号：'+s.unlocked.length+'個</p><h3>直近の記録</h3><table><tr><th>日時</th><th>内容</th><th>値</th></tr>'+s.logs.slice(-30).reverse().map(x=>'<tr><td>'+new Date(x.date).toLocaleDateString('ja-JP')+'</td><td>'+x.type+'</td><td>'+x.value+'</td></tr>').join('')+'</table>'}function equip(t){s.equipped=t;persist()}function exportData(){let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='life-rpg-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.counts)||!Array.isArray(d.logs))throw Error();if(confirm('現在の記録を置き換えるで？')){s=d;persist()}}catch{alert('バックアップ形式を確認してな')}};r.readAsText(f)}render();</script><style>@media print{body{background:white;color:black}.tabs,button,input,.overlay{display:none!important}.panel{background:white;color:black;border:1px solid #aaa}section{display:none!important}#report{display:block!important}main{max-width:none}}</style></body></html>
